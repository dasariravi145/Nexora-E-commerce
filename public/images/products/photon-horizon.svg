<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-photon-horizon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#070E22" />
      <stop offset="100%" stop-color="#09132C" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="glow-photon-horizon" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.4)" />
      <stop offset="70%" stop-color="rgba(7, 14, 34, 0)" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid-photon-horizon" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.15)" />
    </pattern>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="800" height="800" fill="url(#bg-grad-photon-horizon)" />
  <rect width="800" height="800" fill="url(#grid-photon-horizon)" />

  <!-- Ambient Glow Behind Hardware -->
  <circle cx="400" cy="380" r="320" fill="url(#glow-photon-horizon)" />

  <!-- Concentric Telemetry Target Rings -->
  <circle cx="400" cy="380" r="330" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 6" />
  <circle cx="400" cy="380" r="270" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="400" cy="380" r="180" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.1" />

  <!-- Corner Calibration Targets -->
  <g stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4">
    <!-- Top Left -->
    <path d="M 40 60 L 40 40 L 60 40" fill="none" />
    <!-- Top Right -->
    <path d="M 760 60 L 760 40 L 740 40" fill="none" />
    <!-- Bottom Left -->
    <path d="M 40 740 L 40 760 L 60 760" fill="none" />
    <!-- Bottom Right -->
    <path d="M 760 740 L 760 760 L 740 760" fill="none" />
  </g>

  <!-- Top Technical Header -->
  <g font-family="monospace">
    <text x="50" y="55" fill="#06B6D4" font-size="11" font-weight="bold" letter-spacing="2">NEXORA PRECISION LABS • 3D SPECIMEN</text>
    <text x="750" y="55" fill="#94A3B8" font-size="11" text-anchor="end" letter-spacing="1">REF: PHOTON-HORIZON.SVG</text>
  </g>

  <!-- Hardware Silhouette Element -->
  
      <!-- Smartphone Silhouette -->
      <g transform="translate(250, 150)">
        <rect x="0" y="0" width="300" height="500" rx="36" fill="#070E22" stroke="#06B6D4" stroke-width="4" />
        <rect x="12" y="14" width="276" height="472" rx="28" fill="#0B1736" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" />
        <!-- Screen Reflection & Circuit Line -->
        <path d="M 30 50 L 270 450" stroke="#06B6D4" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.3" />
        <!-- Camera Island -->
        <rect x="25" y="30" width="80" height="170" rx="20" fill="#060C1B" stroke="#06B6D4" stroke-width="2" />
        <circle cx="65" cy="65" r="24" fill="#0D1D40" stroke="#06B6D4" stroke-width="3" />
        <circle cx="65" cy="65" r="10" fill="#06B6D4" fill-opacity="0.6" />
        <circle cx="65" cy="125" r="22" fill="#0D1D40" stroke="#06B6D4" stroke-width="2.5" />
        <circle cx="65" cy="125" r="8" fill="#06B6D4" fill-opacity="0.5" />
        <circle cx="65" cy="172" r="14" fill="#0D1D40" stroke="#06B6D4" stroke-width="2" />
        <!-- Micro Speaker / Dynamic Island -->
        <rect x="110" y="24" width="80" height="16" rx="8" fill="#040814" stroke="#06B6D4" stroke-width="1" />
        <!-- Dimension Indicator -->
        <line x1="-30" y1="0" x2="-30" y2="500" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" />
        <line x1="-40" y1="0" x2="-20" y2="0" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" />
        <line x1="-40" y1="500" x2="-20" y2="500" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" />
        <text x="-50" y="255" fill="#06B6D4" font-family="monospace" font-size="12" text-anchor="end" transform="rotate(-90 -50 255)">164.2 MM</text>
      </g>
    

  <!-- Bottom Technical Overlay Card -->
  <g transform="translate(60, 680)">
    <rect x="0" y="0" width="680" height="66" rx="12" fill="#060C1B" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <!-- Indicator Pill -->
    <rect x="18" y="16" width="8" height="34" rx="4" fill="#06B6D4" />
    <!-- Unit Name and Perspective -->
    <text x="38" y="34" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">KINETIC PHOTON HORIZON</text>
    <text x="38" y="52" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="0.5">SUB-PIXEL HOLOGRAPHIC LIGHT-FIELD</text>
    <!-- Angle Tag -->
    <rect x="520" y="18" width="144" height="28" rx="6" fill="#0D1936" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.5" />
    <text x="592" y="36" fill="#06B6D4" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">HOLOGRAPHIC VOLUMETRIC EMITTER</text>
  </g>
</svg>