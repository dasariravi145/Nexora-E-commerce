<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-synapse-controller" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714" />
      <stop offset="50%" stop-color="#070E22" />
      <stop offset="100%" stop-color="#09132C" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="glow-synapse-controller" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.4)" />
      <stop offset="70%" stop-color="rgba(7, 14, 34, 0)" />
    </radialGradient>

    <!-- Technical Grid Pattern -->
    <pattern id="grid-synapse-controller" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.15)" />
    </pattern>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="800" height="800" fill="url(#bg-grad-synapse-controller)" />
  <rect width="800" height="800" fill="url(#grid-synapse-controller)" />

  <!-- Ambient Glow Behind Hardware -->
  <circle cx="400" cy="380" r="320" fill="url(#glow-synapse-controller)" />

  <!-- Concentric Telemetry Target Rings -->
  <circle cx="400" cy="380" r="330" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6 6" />
  <circle cx="400" cy="380" r="270" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="400" cy="380" r="180" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.1" />

  <!-- Corner Calibration Targets -->
  <g stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4">
    <!-- Top Left -->
    <path d="M 40 60 L 40 40 L 60 40" fill="none" />
    <!-- Top Right -->
    <path d="M 760 60 L 760 40 L 740 40" fill="none" />
    <!-- Bottom Left -->
    <path d="M 40 740 L 40 760 L 60 760" fill="none" />
    <!-- Bottom Right -->
    <path d="M 760 740 L 760 760 L 740 760" fill="none" />
  </g>

  <!-- Top Technical Header -->
  <g font-family="monospace">
    <text x="50" y="55" fill="#F59E0B" font-size="11" font-weight="bold" letter-spacing="2">NEXORA PRECISION LABS • 3D SPECIMEN</text>
    <text x="750" y="55" fill="#94A3B8" font-size="11" text-anchor="end" letter-spacing="1">REF: SYNAPSE-CONTROLLER.SVG</text>
  </g>

  <!-- Hardware Silhouette Element -->
  
      <!-- Spatial Visor / Gaming Silhouette -->
      <g transform="translate(180, 200)">
        <!-- Visor Faceplate -->
        <rect x="40" y="60" width="360" height="180" rx="54" fill="#070E22" stroke="#F59E0B" stroke-width="4" />
        <rect x="58" y="76" width="324" height="148" rx="42" fill="#0B1736" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6" />
        <!-- Dual Lenses Reflection -->
        <circle cx="150" cy="150" r="48" fill="#040814" stroke="#F59E0B" stroke-width="3" />
        <circle cx="150" cy="150" r="24" fill="#F59E0B" fill-opacity="0.4" />
        <circle cx="290" cy="150" r="48" fill="#040814" stroke="#F59E0B" stroke-width="3" />
        <circle cx="290" cy="150" r="24" fill="#F59E0B" fill-opacity="0.4" />
        <!-- Headstrap Attachment -->
        <path d="M 40 150 L 0 150" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" />
        <path d="M 400 150 L 440 150" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" />
        <!-- Sensor Array Dots -->
        <circle cx="220" cy="88" r="4" fill="#F59E0B" />
        <circle cx="190" cy="88" r="3" fill="#F59E0B" />
        <circle cx="250" cy="88" r="3" fill="#F59E0B" />
      </g>
    

  <!-- Bottom Technical Overlay Card -->
  <g transform="translate(60, 680)">
    <rect x="0" y="0" width="680" height="66" rx="12" fill="#060C1B" fill-opacity="0.9" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <!-- Indicator Pill -->
    <rect x="18" y="16" width="8" height="34" rx="4" fill="#F59E0B" />
    <!-- Unit Name and Perspective -->
    <text x="38" y="34" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">KINETIC SYNAPSE CONTROLLER</text>
    <text x="38" y="52" fill="#94A3B8" font-family="monospace" font-size="11" letter-spacing="0.5">HALL-EFFECT GIMBALS • DUAL FORCE HAPTICS</text>
    <!-- Angle Tag -->
    <rect x="520" y="18" width="144" height="28" rx="6" fill="#0D1936" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5" />
    <text x="592" y="36" fill="#F59E0B" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">TACTILE NEURAL INTERFACE</text>
  </g>
</svg>